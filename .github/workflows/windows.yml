name: Windows lightweight build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $source = Get-Content -LiteralPath native/Platform.cs -Raw
          $version = [regex]::Match($source, 'const string Version = "(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $version) { throw 'No valid source version.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Release tag and source version must match.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Compile with Windows framework compiler
        run: ./scripts/build-lite.ps1
      - name: Compile regression tests
        run: ./scripts/build-lite.ps1 -Tests
      - name: Test storage, cryptography and real WPF windows
        run: ./dist-lite/NativeTests.exe ./test-results/native
      - name: Test the final standalone executable
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/smoke-lite.ps1 -Executable ./dist-lite/超强大脑.exe -TestRoot ./test-results/standalone
      - name: Test quiet startup, hotkey handoff and window memory release
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/smoke-background.ps1 -Executable ./dist-lite/超强大脑.exe -TestRoot ./test-results/background
      - name: Save test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lite-test-failure-${{ github.run_id }}
          path: |
            test-results/**/failure.txt
            test-results/**/result.json
            test-results/**/background-result.json
            test-results/**/preview.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare lightweight downloads
        if: github.event_name != 'pull_request'
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $binary = Get-Item -LiteralPath dist-lite/超强大脑.exe
          if ($binary.VersionInfo.FileVersion -ne "$env:APP_VERSION.0") { throw 'Binary version mismatch.' }
          if ($binary.Length -gt 1MB) { throw 'Unexpectedly large lightweight binary.' }
          New-Item -ItemType Directory -Path release-assets,dist-lite/portable -Force | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination release-assets/SuperBrain.exe
          Copy-Item -LiteralPath $binary.FullName -Destination dist-lite/portable/超强大脑.exe
          Copy-Item -LiteralPath native/使用说明.txt -Destination dist-lite/portable/使用说明.txt
          $zip = "SuperBrain-Lite-$env:APP_VERSION-win-x64.zip"
          Compress-Archive -LiteralPath dist-lite/portable/超强大脑.exe,dist-lite/portable/使用说明.txt -DestinationPath "release-assets/$zip"
          $names = @('SuperBrain.exe', $zip)
          $checksums = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8NoBOM
          @"
          超强大脑 $env:APP_VERSION · Windows 轻量版

          下载 zip 后解压，双击「超强大脑.exe」。也可直接下载单文件 SuperBrain.exe。
          无需安装，运行文件约 122 KB，不再捆绑 Electron。需要 Windows 10/11 x64 和 .NET Framework 4.8+。
          默认 F8 呼出 / 收起，配置、备忘录和加密密码库放在旁边的 data 文件夹。
          要更换快捷键，在设置中点击快捷键框，直接按键录入并保存。
          按住窗口顶部标题可拖动；背景图下的记录和按钮仍保留清晰底色。
          本版取消主密码至少 12 字符的限制，允许自行设置非空的短密码。
          已有密码先用原密码解锁，再到“设置 → 修改主密码”更换；不会自动改动现有密码。
          在设置中勾选“登录 Windows 后后台启动”，登录后直接按快捷键呼出。
          后台只保留快捷键和托盘；收起时保存、锁定密码库并释放窗口进程，降低待命内存。
          更新时退出后替换运行文件，保留 data。主密码不能找回，普通备忘录为明文。
          v0.1.0 的旧资料保留在原位置，旧加密备份不直接导入轻量版。
          当前未做 Windows 代码签名，可能提示未知发布者。

          使用说明：https://github.com/qzm-qzm/super-brain#readme
          "@ | Set-Content -LiteralPath release-assets/RELEASE-NOTES.md -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: SuperBrain-Lite-${{ steps.version.outputs.value }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: SuperBrain-Lite-*
          path: release-assets
          merge-multiple: true
      - name: Publish lightweight release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $assets = @('release-assets/SuperBrain.exe', "release-assets/SuperBrain-Lite-$version-win-x64.zip", 'release-assets/SHA256SUMS.txt')
          foreach ($file in $assets) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing asset: $file" } }
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Published releases are immutable. Bump version.' }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "超强大脑轻量版 $env:RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
